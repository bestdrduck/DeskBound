name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DeskBound
        shell: pwsh
        run: |
          .\build.ps1
          Copy-Item -LiteralPath "outputs\桌伴.exe" -Destination "outputs\DeskBound.exe"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "outputs/DeskBound.exe"
          --title "桌伴 ${{ github.ref_name }}"
          --generate-notes
