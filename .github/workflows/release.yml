name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DeskBound
        shell: pwsh
        run: |
          .\build.ps1

      - name: Run storage and update self-tests
        shell: pwsh
        run: |
          $process = Start-Process ".\outputs\桌伴.exe" -ArgumentList "--storage-self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path ".\work\DeskBound-storage-self-test.txt") {
              Get-Content ".\work\DeskBound-storage-self-test.txt"
            }
            throw "DeskBound self-tests failed with exit code $($process.ExitCode)."
          }
          Get-Content ".\work\DeskBound-storage-self-test.txt"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "/DMyAppVersion=$version" "installer\DeskBound.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          $notesArgs = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release create "${{ github.ref_name }}" `
            "outputs/DeskBound-Setup.exe" `
            --title "桌伴 ${{ github.ref_name }}" `
            @notesArgs
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
